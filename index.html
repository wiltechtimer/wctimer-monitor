<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WCTimer Online Monitor</title>
  <style>
    :root {
      --bg: #0b0f17;
      --panel: #121826;
      --card: #172033;
      --border: #26334d;
      --text: #e6edf7;
      --muted: #93a4be;
      --accent: #00d09c;
      --accent2: #38bdf8;
      --monthly: #a78bfa;
      --warn: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; }
    .container { max-width: 1280px; margin: 0 auto; }
    .hidden { display: none !important; }

    /* LOGIN SCREEN */
    .login-wrap {
      min-height: calc(100vh - 40px);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 26px 22px;
    }
    .login-card h1 { font-size: 1.25rem; color: var(--accent); letter-spacing: 0.5px; }
    .login-card p { font-size: 0.85rem; color: var(--muted); margin-top: 4px; margin-bottom: 18px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
    .field input {
      width: 100%;
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 8px; padding: 9px 12px; font-size: 0.92rem; outline: none;
    }
    .field input:focus { border-color: var(--accent2); }
    .btn-full { width: 100%; margin-top: 4px; }
    .login-err { margin-top: 10px; font-size: 0.84rem; color: #fca5a5; min-height: 18px; }

    /* DASHBOARD */
    .header {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
      gap: 12px; background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px 20px; margin-bottom: 18px;
    }
    .brand h1 { font-size: 1.25rem; color: var(--accent); letter-spacing: 0.5px; }
    .brand p { font-size: 0.85rem; color: var(--muted); margin-top: 2px; }
    .session-badges { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .meta-tag {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 999px; padding: 3px 10px; font-size: 0.8rem; color: var(--muted);
    }
    .meta-tag strong { color: var(--accent2); }

    .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    button {
      background: var(--accent); color: #062119; border: none; border-radius: 8px;
      padding: 9px 15px; font-weight: 700; font-size: 0.9rem; cursor: pointer;
    }
    button:hover { filter: brightness(1.08); }
    button.secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    button.danger { background: rgba(239, 68, 68, 0.16); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.35); }

    .summary-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px; margin-bottom: 20px;
    }
    .summary-card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px;
    }
    .summary-card .label { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; }
    .summary-card .value { font-size: 1.65rem; font-weight: 800; margin-top: 6px; color: var(--accent2); }
    .summary-card .value.sales { color: var(--accent); }
    .summary-card .value.monthly { color: var(--monthly); }

    .pc-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(275px, 1fr));
      gap: 14px;
    }
    .pc-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px;
    }
    .pc-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .pc-name { font-size: 1.05rem; font-weight: 800; }
    .badge {
      font-size: 0.75rem; font-weight: 700; padding: 4px 9px; border-radius: 999px;
      text-transform: uppercase;
    }
    .badge.active { background: rgba(0, 208, 156, 0.16); color: var(--accent); border: 1px solid rgba(0, 208, 156, 0.35); }
    .badge.locked { background: rgba(239, 68, 68, 0.16); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.35); }
    .badge.offline { background: rgba(148, 163, 184, 0.16); color: var(--muted); border: 1px solid rgba(148, 163, 184, 0.3); }

    .pc-row { display: flex; justify-content: space-between; font-size: 0.88rem; color: var(--muted); }
    .pc-row strong { color: var(--text); }
    .pc-sales-box {
      margin-top: 4px; padding-top: 10px; border-top: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 6px;
    }
    .pc-sales-line {
      display: flex; justify-content: space-between; align-items: baseline;
    }
    .pc-sales-label { font-size: 0.8rem; color: var(--muted); }
    .pc-sales-amount { font-size: 1.15rem; font-weight: 800; color: var(--accent); }
    .pc-monthly-amount { font-size: 1.05rem; font-weight: 800; color: var(--monthly); }

    .status-bar { margin-top: 14px; font-size: 0.82rem; color: var(--muted); }
    .empty { background: var(--panel); border: 1px dashed var(--border); border-radius: 12px; padding: 32px; text-align: center; color: var(--muted); }
  </style>
</head>
<body>
  <!-- LOGIN FORM -->
  <div id="loginView" class="login-wrap">
    <form id="loginForm" class="login-card">
      <h1>WCTIMER MONITOR LOGIN</h1>
      <p>Ilagay ang Area Name at License Key upang makapasok sa dashboard.</p>

      <div class="field">
        <label for="areaInput">Area Name</label>
        <input id="areaInput" type="text" placeholder="Area Name (e.g. Area 1)" required />
      </div>

      <div class="field">
        <label for="keyInput">License Key</label>
        <input id="keyInput" type="text" placeholder="License Key (e.g. WCT-XXXX)" required />
      </div>

      <button id="btnLogin" class="btn-full" type="submit">Login</button>
      <div id="loginErr" class="login-err"></div>
    </form>
  </div>

  <!-- MAIN DASHBOARD -->
  <div id="dashboardView" class="container hidden">
    <div class="header">
      <div class="brand">
        <h1>WCTIMER ONLINE MONITOR</h1>
        <p>Manual Refresh Telemetry &amp; Smooth JS Timer Tick</p>
        <div class="session-badges">
          <span class="meta-tag">Area: <strong id="activeAreaLabel">—</strong></span>
          <span class="meta-tag">License: <strong id="activeKeyLabel">—</strong></span>
        </div>
      </div>
      <div class="controls">
        <button id="btnLoad">Load / Refresh</button>
        <button id="btnAuto" class="secondary">Auto: OFF</button>
        <button id="btnLogout" class="danger">Logout</button>
      </div>
    </div>

    <div class="summary-grid">
      <div class="summary-card">
        <div class="label">Total Daily Sales</div>
        <div id="totalDailySales" class="value sales">₱0.00</div>
      </div>
      <div class="summary-card">
        <div class="label">Total Monthly Sales</div>
        <div id="totalMonthlySales" class="value monthly">₱0.00</div>
      </div>
      <div class="summary-card">
        <div class="label">Online PCs</div>
        <div id="onlineCount" class="value">0 / 0</div>
      </div>
      <div class="summary-card">
        <div class="label">Active Sessions</div>
        <div id="activeCount" class="value">0</div>
      </div>
      <div class="summary-card">
        <div class="label">Last Sync</div>
        <div id="lastSync" class="value" style="font-size:1.1rem;">—</div>
      </div>
    </div>

    <div id="pcGrid" class="pc-grid"></div>
    <div id="statusBar" class="status-bar">Ready.</div>
  </div>

  <script>
    const API_URL = "https://mmlpwveddtltxzgmhfth.supabase.co/functions/v1/wctimer-api";

    const loginView = document.getElementById("loginView");
    const dashboardView = document.getElementById("dashboardView");
    const loginForm = document.getElementById("loginForm");
    const btnLogin = document.getElementById("btnLogin");
    const loginErr = document.getElementById("loginErr");

    const areaInput = document.getElementById("areaInput");
    const keyInput = document.getElementById("keyInput");
    const activeAreaLabel = document.getElementById("activeAreaLabel");
    const activeKeyLabel = document.getElementById("activeKeyLabel");

    const btnLoad = document.getElementById("btnLoad");
    const btnAuto = document.getElementById("btnAuto");
    const btnLogout = document.getElementById("btnLogout");
    const pcGrid = document.getElementById("pcGrid");
    const statusBar = document.getElementById("statusBar");

    areaInput.value = localStorage.getItem("wct_mon_area") || "";
    keyInput.value = localStorage.getItem("wct_mon_key") || "";

    // Manual refresh by default so API calls only run on Login or Load / Refresh (unless toggled ON)
    let autoRefresh = false;
    let pollTimer = null;
    let tickTimer = null;

    // Stores per-PC live display state for smooth client-side 1s ticking
    let livePcStates = [];

    function formatPeso(val) {
      const num = Number(val || 0);
      return "₱" + num.toLocaleString("en-PH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function getIndividualPcSales(row) {
      if (row.pc_sales_today !== undefined && row.pc_sales_today !== null) {
        return Number(row.pc_sales_today) || 0;
      }
      return Number(row.sales_today) || 0;
    }

    function getIndividualPcMonthlySales(row) {
      if (row.pc_sales_month !== undefined && row.pc_sales_month !== null) {
        return Number(row.pc_sales_month) || 0;
      }
      return Number(row.sales_month) || 0;
    }

    // Parses formats like "997D9H47M9S", "12H30M15S", "01:25:10", or "15:00" into total seconds
    function parseTimeLeftToSeconds(raw) {
      if (!raw || typeof raw !== "string") return null;
      const str = raw.trim().toUpperCase();
      if (!str || str === "—" || str === "EXPIRED" || str === "0S") return null;

      // Compact D/H/M/S format (e.g., 997D9H47M9S)
      const dhmsMatch = str.match(/^(?:(\d+)D)?(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/);
      if (dhmsMatch && (dhmsMatch[1] || dhmsMatch[2] || dhmsMatch[3] || dhmsMatch[4])) {
        const d = Number(dhmsMatch[1] || 0);
        const h = Number(dhmsMatch[2] || 0);
        const m = Number(dhmsMatch[3] || 0);
        const s = Number(dhmsMatch[4] || 0);
        return (((d * 24) + h) * 60 + m) * 60 + s;
      }

      // HH:MM:SS or MM:SS format
      if (/^\d{1,3}:\d{2}(?::\d{2})?$/.test(str)) {
        const parts = str.split(":").map(Number);
        if (parts.length === 3) {
          return (parts[0] * 3600) + (parts[1] * 60) + parts[2];
        }
        if (parts.length === 2) {
          return (parts[0] * 60) + parts[1];
        }
      }

      return null;
    }

    function formatSecondsToDhms(totalSec) {
      const sec = Math.max(0, Math.floor(Number(totalSec) || 0));
      const d = Math.floor(sec / 86400);
      const h = Math.floor((sec % 86400) / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;

      if (d > 0) return `${d}D${h}H${m}M${s}S`;
      if (h > 0) return `${h}H${m}M${s}S`;
      if (m > 0) return `${m}M${s}S`;
      return `${s}S`;
    }

    function showDashboardView(area_name, license_key) {
      activeAreaLabel.textContent = area_name;
      activeKeyLabel.textContent = license_key;
      loginView.classList.add("hidden");
      dashboardView.classList.remove("hidden");
    }

    function showLoginView() {
      localStorage.removeItem("wct_mon_area");
      localStorage.removeItem("wct_mon_key");
      areaInput.value = "";
      keyInput.value = "";
      loginErr.textContent = "";
      livePcStates = [];
      dashboardView.classList.add("hidden");
      loginView.classList.remove("hidden");
    }

    function renderDashboard(rows) {
      const list = Array.isArray(rows) ? rows : [];
      const salesRow = list.find(r => String(r.pc_name || "").toUpperCase() === "MIKROTIK_SALES");
      const pcList = list.filter(r => String(r.pc_name || "").toUpperCase() !== "MIKROTIK_SALES");

      const totalDaily = salesRow
        ? Number(salesRow.sales_today ?? getIndividualPcSales(salesRow)) || 0
        : pcList.reduce((acc, r) => acc + getIndividualPcSales(r), 0);

      const totalMonthly = salesRow
        ? Number(salesRow.sales_month ?? getIndividualPcMonthlySales(salesRow)) || 0
        : pcList.reduce((acc, r) => acc + getIndividualPcMonthlySales(r), 0);

      const onlinePcs = pcList.filter(r => Boolean(r.is_online)).length;
      const activePcs = pcList.filter(r => String(r.session_status || "").toUpperCase() === "ACTIVE").length;

      document.getElementById("totalDailySales").textContent = formatPeso(totalDaily);
      document.getElementById("totalMonthlySales").textContent = formatPeso(totalMonthly);
      document.getElementById("onlineCount").textContent = `${onlinePcs} / ${pcList.length}`;
      document.getElementById("activeCount").textContent = String(activePcs);
      document.getElementById("lastSync").textContent = new Date().toLocaleTimeString();

      if (pcList.length === 0) {
        livePcStates = [];
        pcGrid.innerHTML = `<div class="empty">No PC telemetry rows found for this Area &amp; License Key.</div>`;
        return;
      }

      livePcStates = pcList.map((row, idx) => {
        const isOnline = Boolean(row.is_online);
        const statusText = String(row.session_status || (isOnline ? "LOCKED" : "OFFLINE")).toUpperCase();
        let badgeClass = "offline";
        if (!isOnline) badgeClass = "offline";
        else if (statusText === "ACTIVE") badgeClass = "active";
        else badgeClass = "locked";

        const rawTimeLeft = row.time_left || "—";
        const parsedSec = parseTimeLeftToSeconds(rawTimeLeft);
        const canTickTime = isOnline && statusText === "ACTIVE" && parsedSec !== null && parsedSec > 0;
        const canTickLastSeen = isOnline;

        const baseLastSeenMs = row.last_seen
          ? (new Date(row.last_seen).getTime() || Date.now())
          : (isOnline ? Date.now() : null);

        return {
          id: `pc-card-${idx}`,
          pcName: row.pc_name || "UNKNOWN",
          badgeClass,
          statusText,
          isOnline,
          remainingSec: canTickTime ? parsedSec : null,
          staticTimeLeft: rawTimeLeft,
          canTickTime,
          canTickLastSeen,
          displayLastSeenMs: baseLastSeenMs,
          indivSales: getIndividualPcSales(row),
          indivMonthly: getIndividualPcMonthlySales(row)
        };
      });

      pcGrid.innerHTML = livePcStates.map(st => {
        const timeLeftDisplay = st.canTickTime ? formatSecondsToDhms(st.remainingSec) : st.staticTimeLeft;
        const lastSeenDisplay = st.displayLastSeenMs
          ? new Date(st.displayLastSeenMs).toLocaleTimeString()
          : "—";

        return `
          <div class="pc-card" id="${st.id}">
            <div class="pc-top">
              <div class="pc-name">${escapeHtml(st.pcName)}</div>
              <span class="badge ${st.badgeClass}">${escapeHtml(st.statusText)}</span>
            </div>
            <div class="pc-row"><span>Time Left</span><strong class="js-time-left">${escapeHtml(timeLeftDisplay)}</strong></div>
            <div class="pc-row"><span>Last Seen</span><strong class="js-last-seen">${escapeHtml(lastSeenDisplay)}</strong></div>
            <div class="pc-sales-box">
              <div class="pc-sales-line">
                <span class="pc-sales-label">Individual Sales Today</span>
                <span class="pc-sales-amount">${formatPeso(st.indivSales)}</span>
              </div>
              <div class="pc-sales-line">
                <span class="pc-sales-label">Monthly Sales</span>
                <span class="pc-monthly-amount">${formatPeso(st.indivMonthly)}</span>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    // Client-side 1s visual ticker so Time Left & Last Seen keep moving smoothly between manual refreshes
    function tickDisplayTimers() {
      if (dashboardView.classList.contains("hidden") || livePcStates.length === 0) return;

      for (const st of livePcStates) {
        const cardEl = document.getElementById(st.id);
        if (!cardEl) continue;

        if (st.canTickTime && typeof st.remainingSec === "number") {
          if (st.remainingSec > 0) {
            st.remainingSec -= 1;
          }
          const timeEl = cardEl.querySelector(".js-time-left");
          if (timeEl) {
            timeEl.textContent = st.remainingSec > 0 ? formatSecondsToDhms(st.remainingSec) : "EXPIRED";
          }
        }

        if (st.canTickLastSeen && typeof st.displayLastSeenMs === "number") {
          st.displayLastSeenMs += 1000;
          const seenEl = cardEl.querySelector(".js-last-seen");
          if (seenEl) {
            seenEl.textContent = new Date(st.displayLastSeenMs).toLocaleTimeString();
          }
        }
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    async function requestMonitor(area_name, license_key) {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "monitor", area_name, license_key })
      });
      const data = await res.json();
      if (!res.ok || !data.ok) {
        throw new Error(data.message || `HTTP ${res.status}`);
      }
      return data;
    }

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const area_name = areaInput.value.trim();
      const license_key = keyInput.value.trim().toUpperCase();

      if (!area_name || !license_key) {
        loginErr.textContent = "Enter both Area Name and License Key.";
        return;
      }

      loginErr.textContent = "";
      btnLogin.disabled = true;
      btnLogin.textContent = "Checking...";

      try {
        const data = await requestMonitor(area_name, license_key);
        localStorage.setItem("wct_mon_area", area_name);
        localStorage.setItem("wct_mon_key", license_key);
        showDashboardView(area_name, license_key);
        renderDashboard(data.rows || []);
        statusBar.textContent = `Connected to ${area_name} • ${new Date().toLocaleString()}`;
      } catch (err) {
        loginErr.textContent = `Login failed: ${err.message}`;
      } finally {
        btnLogin.disabled = false;
        btnLogin.textContent = "Login";
      }
    });

    async function fetchMonitorData() {
      const area_name = (localStorage.getItem("wct_mon_area") || areaInput.value).trim();
      const license_key = (localStorage.getItem("wct_mon_key") || keyInput.value).trim().toUpperCase();

      if (!area_name || !license_key) {
        showLoginView();
        return;
      }

      try {
        statusBar.textContent = "Syncing with wctimer-api...";
        const data = await requestMonitor(area_name, license_key);
        renderDashboard(data.rows || []);
        statusBar.textContent = `Connected to ${area_name} • ${new Date().toLocaleString()}`;
      } catch (err) {
        statusBar.textContent = `Sync error: ${err.message}`;
      }
    }

    btnLoad.addEventListener("click", fetchMonitorData);
    btnAuto.addEventListener("click", () => {
      autoRefresh = !autoRefresh;
      btnAuto.textContent = `Auto: ${autoRefresh ? "ON (10s)" : "OFF"}`;
      btnAuto.className = "secondary";
    });
    btnLogout.addEventListener("click", showLoginView);

    tickTimer = setInterval(tickDisplayTimers, 1000);

    pollTimer = setInterval(() => {
      if (autoRefresh && !document.hidden && !dashboardView.classList.contains("hidden")) {
        fetchMonitorData();
      }
    }, 10000);

    if (areaInput.value.trim() && keyInput.value.trim()) {
      showDashboardView(areaInput.value.trim(), keyInput.value.trim().toUpperCase());
      fetchMonitorData();
    }
  </script>
</body>
</html>
